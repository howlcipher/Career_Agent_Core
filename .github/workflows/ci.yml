name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Check Formatting
      run: |
        unformatted=$(gofmt -l ./cmd ./pkg ./internal)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Go Build
      run: go build ./...

    - name: Go Vet
      run: go vet ./...

    - name: Go Test
      run: go test ./...

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/dashboard/ui
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: cmd/dashboard/ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint || echo "Linting failed, but continuing for now" # Adjust based on strictness

    - name: Run Tests
      run: npm test -- --run

    - name: Build
      run: npm run build
